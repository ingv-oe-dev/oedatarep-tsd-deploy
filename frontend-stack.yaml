networks:
  public_net:
    external: true
    name: oedatarep-public
services:
  frontend:
    image: nginx
    networks:
      - public_net
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    deploy:
      replicas: 1
      placement:
        constraints:
          - "node.labels.tier == frontend"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/opt/invenio/var/instance/static:ro
    secrets:
      - source: cert_v1
        target: /etc/ssl/certs/test.crt
      - source: key_v1
        target: /etc/ssl/private/test.key
volumes:
  static_data:
    external: true
    name: datarep_static_data

secrets:
  cert_v1:
    external: true
  key_v1:
    external: true